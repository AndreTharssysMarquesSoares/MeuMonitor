{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Interesses - Meu Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-3">
                    <img src="{% static 'core/img/MeuMonitor.png' %}" alt="Logo Meu Monitor" class="h-10 w-auto object-contain">
                    <div>
                        <p class="text-xs text-gray-500 font-medium leading-none mt-1">{{ aluno_nome }}</p>
                    </div>
                </div>
                
                <nav class="hidden md:flex space-x-8 items-center">
                    <a href="{% url 'dashboard' %}" class="text-gray-500 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium transition-colors">Dashboard</a>
                    
                    <a href="{% url 'disciplinas' %}" class="text-gray-500 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium transition-colors">Disciplinas</a>
                    
                    <a href="{% url 'meus_interesses' %}" class="bg-blue-50 text-blue-700 px-3 py-2 rounded-md text-sm font-medium transition-colors">Meus interesses</a>

                    <a href="{% url 'perfil' %}" class="text-gray-500 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium transition-colors">Meu perfil</a>
                </nav>

                <div class="flex items-center gap-4">
                    <button class="relative p-2 text-gray-400 hover:text-gray-500 transition-colors">
                        <span class="absolute top-1 right-1 h-4 w-4 bg-red-500 rounded-full text-[10px] text-white flex items-center justify-center border-2 border-white shadow-sm">1</span>
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                        </svg>
                    </button>

                    <a href="{% url 'logout' %}" class="flex items-center gap-2 text-gray-500 hover:text-red-600 text-sm font-medium transition-colors">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                        Sair
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-12">
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-gray-900 mt-2">📚 Disciplinas Inscritas</h2>
        </div>

        <div class="grid gap-4">
    <a href="{% url 'disciplina_monitor' %}" 
       class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm hover:border-blue-500 hover:shadow-md transition-all flex justify-between items-center group">
        <h3 class="text-xl font-bold text-gray-800 group-hover:text-blue-700">Cálculo Diferencial e Integral I</h3>
        
        <div class="flex items-center gap-3">
            <div class="bg-blue-100 text-blue-800 px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest shadow-inner">3456789</div>
            <svg class="w-6 h-6 text-gray-300 group-hover:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
        </div>
    </a>

    <a href="#" 
       class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm hover:border-blue-500 hover:shadow-md transition-all flex justify-between items-center group">
        <h3 class="text-xl font-bold text-gray-800 group-hover:text-blue-700">Ondas e Linhas</h3>
        
        <div class="flex items-center gap-3">
            <div class="bg-blue-100 text-blue-800 px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest shadow-inner">1234567</div>
            <svg class="w-6 h-6 text-gray-300 group-hover:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
        </div>
    </a>
</div>
    </main>

</body>
</html>
